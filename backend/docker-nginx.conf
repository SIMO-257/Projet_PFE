server {
    listen __PORT__;
    server_name _;
    root /var/www/public;
    index index.php index.html;
    charset utf-8;

    client_max_body_size 20M;

    # 1. Health check endpoint for DigitalOcean App Platform
    location = /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # 2. Handle all traffic — DO strips the /api prefix before forwarding,
    #    so we rewrite the URI to prepend /api back for Laravel's router.
    location / {
        rewrite ^/(.*)$ /api/$1 break;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # 3. Pass PHP Requests to PHP-FPM
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ /\. {
        deny all;
    }
}