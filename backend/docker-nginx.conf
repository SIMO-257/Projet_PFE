server {
    listen __PORT__; # This gets replaced by your script
    server_name _;
    root /var/www/public; # Make sure this points to your Laravel public directory

    index index.php index.html;
    charset utf-8;

    # 1. Handle Standard API and Web Traffic
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # 2. Pass PHP Requests to PHP-FPM (Port 9000)
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # 3. Handle Laravel Reverb WebSockets Traffic (/app path)
    location /app {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;
}